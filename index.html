<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은우의 한자 모험 · 퀴즈로 열리는 단계</title>
<meta name="description" content="퀴즈를 통과하면 다음 단계가 열리고, 한자를 직접 써 볼 수 있는 한자 놀이터. 기초 1·2·3단계와 8급 50자.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FFD95A'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%2334325A' font-family='serif' font-weight='700'%3E漢%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#34325A;--muted:#6A6890;--card:#fff;--sun:#FFD95A;--sunD:#E8B800;--pink:#FF8FA8;--sky:#CFE8FF;--mint:#CDF3E4;--peach:#FFE3C7;
--acc:#4A9BE8;--tint:#DCEEFF;--dark:#1F6CB8;--ok:#D5F4E0;--okB:#2E9B5A;--no:#FFE1E1;--noB:#E5645F;
--round:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--sans:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--hz:'Noto Serif KR','Batang','AppleMyungjo',serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;min-height:100vh;
background:radial-gradient(circle at 12% 8%,#FFF3C9 0,transparent 38%),radial-gradient(circle at 92% 14%,#D9F0FF 0,transparent 40%),radial-gradient(circle at 50% 100%,#FFE1EA 0,transparent 45%),#FFFBF2;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.top a{font-weight:700;background:#fff;border-radius:999px;padding:6px 14px;text-decoration:none;box-shadow:0 2px 0 rgba(52,50,90,.12)}
.hero{display:flex;gap:14px;align-items:center;margin:14px 0 4px}
.mascot{flex:none;width:84px;height:84px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--hz);font-weight:900;font-size:50px;color:var(--ink);box-shadow:0 5px 0 var(--sunD);position:relative;animation:bob 3s ease-in-out infinite}
.mascot:after{content:'✨';position:absolute;right:-6px;top:-8px;font-size:22px}
@keyframes bob{50%{transform:translateY(-5px)}}
h1{font-family:var(--round);font-weight:400;font-size:30px;line-height:1.22;margin:0}
.hero p{margin:4px 0 0;color:var(--muted);font-size:15px}
.sum{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;box-shadow:0 2px 0 rgba(52,50,90,.12)}
.rule{margin:8px 0 0;font-size:14px;color:var(--muted)}
.book{margin-top:24px;--acc:#4A9BE8}
.bh{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:22px;background:var(--tint)}
.bm{flex:none;width:46px;height:46px;border-radius:16px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:var(--hz);font-weight:900;font-size:26px;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.bh b{display:block;font-family:var(--round);font-weight:400;font-size:20px;line-height:1.25;color:var(--dark)}
.bh small{color:var(--muted);font-size:13px}
.path{list-style:none;margin:12px 0 0;padding:0 0 0 14px;display:grid;gap:12px;border-left:6px dotted var(--acc)}
.node{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:0;border-radius:22px;padding:12px 14px;min-height:68px;box-shadow:0 4px 0 rgba(52,50,90,.14);position:relative;margin-left:-4px}
.node:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 6px 0 rgba(52,50,90,.16)}
.node[disabled]{cursor:not-allowed;background:#F1EFF6;box-shadow:none;color:#8A88A8}
.node.now{outline:4px solid var(--sun);outline-offset:2px}
.nn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--dark);display:grid;place-items:center;font-weight:700;font-family:var(--round);font-size:19px}
.node[disabled] .nn{background:#E2E0EC;color:#8A88A8;font-size:18px}
.nt{flex:1;min-width:0}
.nt b{display:block;font-family:var(--round);font-weight:400;font-size:18px;line-height:1.3}
.nt span{font-size:13px;color:var(--muted)}
.st{flex:none;font-size:20px;letter-spacing:1px;color:#F5A500;white-space:nowrap;font-weight:700;text-align:right;line-height:1.2}
.st small{color:var(--muted);font-size:12px;letter-spacing:0;font-weight:400;display:block}
.go{background:var(--sun);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:15px;letter-spacing:0}
.back{background:#fff;border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;box-shadow:0 2px 0 rgba(52,50,90,.12)}
.sh{margin:12px 0 0;--acc:#4A9BE8}
.sh .tag{display:inline-block;font-size:14px;color:var(--dark);font-weight:700;background:var(--tint);border-radius:999px;padding:2px 12px}
.sh h2{margin:6px 0 0;font-family:var(--round);font-weight:400;font-size:28px;line-height:1.25}
.sh p{margin:4px 0 0;color:var(--muted);font-size:15px}
.panel{background:var(--card);border-radius:24px;padding:16px;margin-top:16px;box-shadow:0 4px 0 rgba(52,50,90,.12)}
.panel h3{margin:0 0 10px;font-family:var(--round);font-weight:400;font-size:18px;color:var(--dark)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cell{border-radius:16px;background:var(--tint);padding:8px 4px;text-align:center}
.cell .g{font-family:var(--hz);font-weight:900;line-height:1.15;word-break:keep-all}
.cell .l{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.rows{width:100%;border-collapse:collapse}
.rows td{border-bottom:2px dotted #DDDAEC;padding:8px 6px;vertical-align:top}
.rows td:first-child{width:64px;font-weight:700;color:var(--dark)}
.rows td:last-child{font-family:var(--hz);font-weight:600;font-size:24px;letter-spacing:4px;word-break:break-all}
details{margin-top:12px}
summary{cursor:pointer;font-weight:700;padding:6px 0}
ol.days{margin:6px 0 0;padding-left:26px;font-size:14px}
ol.days li{margin:2px 0}
.big-btn{display:block;width:100%;margin-top:16px;padding:15px;background:var(--sun);color:var(--ink);border:0;border-radius:22px;font-family:var(--round);font-size:21px;box-shadow:0 5px 0 var(--sunD)}
.big-btn:hover{filter:brightness(1.03)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sunD)}
.big-btn.alt{background:#fff;box-shadow:0 5px 0 rgba(52,50,90,.16)}
.big-btn.alt:active{box-shadow:0 2px 0 rgba(52,50,90,.16)}
.big-btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .big-btn{flex:1 1 200px}
.bar{height:14px;background:rgba(52,50,90,.1);border-radius:999px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .3s}
.qn{font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.q{background:var(--card);border-radius:26px;padding:18px 16px;margin-top:6px;box-shadow:0 5px 0 rgba(52,50,90,.12)}
.q .qt{font-family:var(--round);font-size:21px;line-height:1.45}
.q .big{font-family:var(--hz);font-weight:900;text-align:center;margin:12px 0 4px;line-height:1.1;word-break:keep-all;background:var(--tint);border-radius:22px;padding:12px 6px}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.hz{grid-template-columns:1fr 1fr}
.opt{background:#FFF9E5;border:3px solid #FFE9A8;border-radius:20px;padding:12px 14px;text-align:left;min-height:58px;font-size:18px;display:flex;align-items:center;gap:10px}
.opts.hz .opt{justify-content:center;font-family:var(--hz);font-weight:900;font-size:44px;min-height:96px;background:var(--sky);border-color:#B6DBFA}
.opt:hover:not([disabled]){transform:translateY(-2px)}
.opt .mk{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--dark)}
.opts.hz .mk{display:none}
.opt.ok{background:var(--ok);border-color:var(--okB)}
.opt.no{background:var(--no);border-color:var(--noB)}
.opt[disabled]{cursor:default;transform:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:18px;font-size:16px}
.fb.good{background:var(--ok)}
.fb.bad{background:var(--no)}
.fb b{font-family:var(--round);font-weight:400;font-size:18px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:16px}
.mt button{background:#FFF9E5;border:3px solid #FFE9A8;border-radius:18px;padding:10px 12px;min-height:56px;text-align:left;font-size:17px;position:relative}
.mt button.l{font-family:var(--hz);font-weight:900;font-size:28px;text-align:center;background:var(--sky);border-color:#B6DBFA}
.mt button.sel{outline:4px solid var(--sun);outline-offset:1px}
.mt button.ok{background:var(--ok);border-color:var(--okB)}
.mt button.no{background:var(--no);border-color:var(--noB)}
.bd{position:absolute;right:6px;top:4px;font-size:12px;font-weight:900;color:#fff;background:#FF6F91;border-radius:10px;padding:0 7px;line-height:20px;font-family:var(--sans)}
.ans{margin-top:14px;padding:14px;border-radius:18px;background:var(--mint);font-family:var(--round);font-size:21px}
.res{text-align:center;margin-top:18px}
.res .stamp{display:inline-grid;place-items:center;width:142px;height:142px;border-radius:50%;background:var(--sun);font-size:70px;box-shadow:0 7px 0 var(--sunD);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.res .stamp.fail{background:var(--sky);box-shadow:0 7px 0 #A5CDEE}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0)}}
.res h2{font-family:var(--round);font-weight:400;font-size:32px;margin:14px 0 2px}
.res .stars{font-size:38px;color:#F5A500;letter-spacing:4px}
.res p{color:var(--muted);margin:4px 0}
.wrong{margin-top:18px;text-align:left}
.wrong ul{padding-left:20px}
.wrong li{margin:6px 0;font-size:15px}
.wrong em{font-style:normal;font-weight:700;color:#C2304F}
.foot{margin-top:38px;padding-top:14px;border-top:2px dotted #DDDAEC;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.foot button{background:#fff;border:0;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);box-shadow:0 2px 0 rgba(52,50,90,.12)}
/* 쓰기 패드 */
.pickstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.pk{flex:none;width:52px;height:52px;border-radius:16px;border:3px solid transparent;background:var(--tint);font-family:var(--hz);font-weight:900;font-size:26px;display:grid;place-items:center}
.pk.on{border-color:var(--ink);background:var(--sun)}
.pinfo{text-align:center;font-family:var(--round);font-size:19px;margin:2px 0 8px}
.pinfo small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted)}
.padwrap{max-width:340px;margin:0 auto}
.pad{position:relative;width:100%;aspect-ratio:1;border-radius:24px;background:#fff;border:4px solid var(--acc);overflow:hidden;
background-image:linear-gradient(to right,transparent calc(50% - 1px),rgba(74,155,232,.28) calc(50% - 1px),rgba(74,155,232,.28) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to bottom,transparent calc(50% - 1px),rgba(74,155,232,.28) calc(50% - 1px),rgba(74,155,232,.28) calc(50% + 1px),transparent calc(50% + 1px))}
.pad .gl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hz);font-weight:600;font-size:min(62vw,230px);line-height:1;color:rgba(52,50,90,.14);pointer-events:none;user-select:none}
.pad .gl.off{visibility:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padbtn{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.padbtn button{background:var(--mint);border:0;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;box-shadow:0 3px 0 rgba(52,50,90,.14)}
.qpadbtn{margin-top:12px;background:var(--mint);border:0;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;box-shadow:0 3px 0 rgba(52,50,90,.14)}
:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
@media (max-width:420px){h1{font-size:25px}.mascot{width:68px;height:68px;font-size:40px}.opts.hz .opt{font-size:38px}.q .qt{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const ST = DATA.stages, BYID = Object.fromEntries(ST.map(s => [s.id, s]));
const app = document.getElementById('app');
let S = load(), run = null, pracChar = null;

function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.best) return v; } catch(e){} return {best:{}, all:false}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stars(n){ return n >= 10 ? 3 : n === 9 ? 2 : n >= PASS ? 1 : 0; }
function starStr(n){ const k = stars(n); return '★'.repeat(k) + '<span style="color:#D8D5E8">' + '★'.repeat(3 - k) + '</span>'; }
function unlocked(i){ return S.all || i === 0 || (S.best[ST[i-1].id] ?? -1) >= PASS; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function bigSize(t){ const n = [...t].length; return n <= 1 ? 96 : n === 2 ? 72 : n === 3 ? 54 : 40; }

/* ---------- routing ---------- */
function go(h){ if (location.hash === h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [v, id] = h.split('/');
  window.scrollTo(0, 0);
  if (v === 's' && BYID[id]) return stageView(id);
  if (v === 'q' && BYID[id]) return startQuiz(id);
  homeView();
}

/* ---------- home ---------- */
function homeView(){
  const cleared = ST.filter(s => (S.best[s.id] ?? -1) >= PASS).length;
  const total = ST.reduce((a, s) => a + stars(S.best[s.id] ?? 0), 0);
  const nowIdx = ST.findIndex((s, i) => unlocked(i) && (S.best[s.id] ?? -1) < PASS);
  let h = `<div class="top"><span>🌈 은우의 한자 놀이터</span><a href="https://kanghyewoo112.github.io/ewmath/">🔢 수학 퀴즈로</a></div>
  <div class="hero"><div class="mascot" aria-hidden="true">漢</div><div><h1>퀴즈를 통과하면<br>다음 단계가 열려요!</h1><p>보고 · 써 보고 · 풀어 봐요. 한 단계에 퀴즈 10문제</p></div></div>
  <div class="sum"><span class="pill">🚩 통과 ${cleared} / ${ST.length}단계</span><span class="pill">⭐ 별 ${total} / ${ST.length*3}</span></div>
  <p class="rule">10문제 중 <b>${PASS}개 이상</b> 맞히면 통과! 10개 ★★★ · 9개 ★★ · ${PASS}개 ★</p>`;
  for (const b of DATA.books) {
    h += `<section class="book" style="${bvars(b.id)}"><div class="bh"><div class="bm" aria-hidden="true">${esc(b.mark)}</div><div><b>${esc(b.name)} · ${esc(b.sub)}</b><small>${esc(b.desc)}</small></div></div><ul class="path">`;
    for (const s of ST) {
      if (s.book !== b.id) continue;
      const i = ST.indexOf(s), ok = unlocked(i), best = S.best[s.id];
      const stat = best === undefined ? (ok ? '' : '🔒') : `${starStr(best)}<small>${best}/10</small>`;
      h += `<li><button class="node${i === nowIdx ? ' now' : ''}" ${ok ? `onclick="go('#/s/${s.id}')"` : 'disabled aria-label="앞 단계를 통과하면 열려요"'}>
        <span class="nn">${s.no}</span><span class="nt"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></span>
        <span class="st">${stat || (i === nowIdx ? '<span class="go">도전 ›</span>' : '')}</span></button></li>`;
    }
    h += `</ul></section>`;
  }
  h += `<div class="foot"><span>기록은 이 기기의 브라우저에만 저장돼요.</span>
    <button onclick="toggleAll()">${S.all ? '부모용: 잠금 다시 켜기' : '부모용: 모든 단계 열기'}</button>
    <button onclick="resetAll()">기록 지우기</button></div>`;
  app.innerHTML = h;
}
function toggleAll(){ S.all = !S.all; save(); homeView(); }
function resetAll(){ if (confirm('통과 기록을 모두 지울까요?')) { S = {best:{}, all:false}; save(); homeView(); } }

/* ---------- 쓰기 패드 ---------- */
function padBox(id, ch, guide){
  return `<div class="padwrap"><div class="pad" id="${id}"><div class="gl ${guide ? '' : 'off'}">${esc(ch)}</div><canvas aria-label="한자를 쓰는 칸"></canvas></div>
  <div class="padbtn"><button onclick="padClear('${id}')">🧽 지우기</button>${ch ? `<button onclick="padGuide('${id}')">👀 따라쓰기 글자 켜고 끄기</button>` : ''}</div></div>`;
}
function padInit(id){
  const box = document.getElementById(id); if (!box) return;
  const cv = box.querySelector('canvas'), dpr = window.devicePixelRatio || 1;
  const r = box.getBoundingClientRect(); cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext('2d'); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(8, r.width / 24) * dpr; ctx.strokeStyle = '#34325A';
  let drawing = false, last = null;
  const pos = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
  cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], ctx.lineWidth / 2, 0, 7); ctx.fillStyle = '#34325A'; ctx.fill(); e.preventDefault(); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; e.preventDefault(); });
  const end = () => { drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
}
function padClear(id){ const cv = document.querySelector('#' + id + ' canvas'); if (cv) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
function padGuide(id){ const g = document.querySelector('#' + id + ' .gl'); if (g) g.classList.toggle('off'); }
function practiceChars(s){
  const out = [], seen = new Set(), st = s.strip;
  const add = t => { for (const c of t) if (/[一-鿿]/.test(c) && !seen.has(c)) { seen.add(c); out.push(c); } };
  if (st.cells) st.cells.forEach(c => add(c[0])); else st.rows.forEach(r => add(r[1]));
  return out.slice(0, 60);
}
function pickPrac(c){
  pracChar = c;
  document.querySelectorAll('.pk').forEach(el => el.classList.toggle('on', el.dataset.c === c));
  const hn = DATA.hun[c], sk = DATA.stroke[c];
  document.getElementById('pracbox').innerHTML = `<div class="pinfo">${hn ? esc(hn) : esc(c)}<small>${sk ? sk + '획 · ' : ''}흐린 글자를 따라 쓴 뒤, 👀를 눌러 가리고 다시 써 봐요</small></div>` + padBox('pp', c, true);
  padInit('pp');
}

/* ---------- stage (배우기) ---------- */
function stageView(id){
  const s = BYID[id], b = BOOK[s.book], i = ST.indexOf(s);
  if (!unlocked(i)) return go('#/');
  const st = s.strip; let body = '';
  if (st.kind === 'cells') {
    const gs = st.cells.reduce((m, c) => Math.max(m, [...c[0]].length), 1);
    const fs = gs <= 1 ? 38 : gs === 2 ? 30 : 22;
    body = '<div class="cells">' + st.cells.map(c => `<div class="cell"><div class="g" style="font-size:${fs}px">${esc(c[0])}</div><div class="l">${esc(c[1])}</div></div>`).join('') + '</div>';
  } else {
    body = '<table class="rows">' + st.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('') + '</table>';
  }
  const chars = practiceChars(s);
  const prev = (S.best[id] !== undefined) ? `<p class="rule">지난 기록: ${starStr(S.best[id])} ${S.best[id]}/10</p>` : '';
  app.innerHTML = `<button class="back" onclick="go('#/')">‹ 단계 지도</button>
  <div class="sh" style="${bvars(s.book)}"><span class="tag">${esc(b.name)} · ${s.no}단계</span><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p></div>
  <div class="panel" style="${bvars(s.book)}"><h3>① 먼저 훑어보기 — 소리 내어 읽어요 👀</h3>${body}
    <details><summary>30일 코스 보기 (집에서 하루씩)</summary><ol class="days">${s.days.map(d => `<li>${esc(d)}</li>`).join('')}<li>복습하기</li><li><b>확인 문제 — 아래 퀴즈!</b></li></ol></details></div>
  ${chars.length ? `<div class="panel" style="${bvars(s.book)}"><h3>② 직접 써 봐요 ✏️</h3><div class="pickstrip">${chars.map(c => `<button class="pk" data-c="${esc(c)}" onclick="pickPrac('${c}')">${esc(c)}</button>`).join('')}</div><div id="pracbox"></div></div>` : ''}
  ${prev}<button class="big-btn" onclick="go('#/q/${id}')">③ 퀴즈 시작! (10문제)</button>
  <p class="rule">${PASS}개 이상 맞히면 ${i + 1 < ST.length ? '다음 단계가 열려요.' : '모든 단계 통과!'} 틀려도 괜찮아요. 몇 번이든 다시 도전해요 💪</p>`;
  if (chars.length) pickPrac(chars[0]);
}

/* ---------- quiz ---------- */
function startQuiz(id){
  const s = BYID[id]; if (!unlocked(ST.indexOf(s))) return go('#/');
  run = { id, i: 0, res: [], wrong: [], st: null };
  renderQ();
}
function bigHTML(t){ return t ? `<div class="big" style="font-size:${bigSize(t)}px">${esc(t)}</div>` : ''; }
function renderQ(){
  const s = BYID[run.id], q = s.quiz[run.i], n = s.quiz.length, b = BOOK[s.book];
  const head = `<div style="${bvars(s.book)}"><button class="back" onclick="leaveQuiz()">‹ 그만하기</button>
    <div class="qn" style="margin-top:10px"><span>${esc(b.name)} · ${esc(s.title)}</span><span>${run.i + 1} / ${n}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${run.i}"><i style="width:${run.i / n * 100}%"></i></div></div>`;
  let body = '';
  if (q.k === 'mc') {
    const order = shuffle(q.opts.map((_, i) => i));
    run.st = { order, done: false };
    body = `<div class="q" style="${bvars(s.book)}"><div class="qt">${esc(q.q)}</div>${bigHTML(q.big)}${q.hz ? `<button class="qpadbtn" onclick="toggleQPad()">✏️ 손으로 써 보기</button><div id="qpadbox"></div>` : ''}<div class="opts${q.hz ? ' hz' : ''}" id="opts">` +
      order.map((oi, k) => `<button class="opt" data-o="${oi}" onclick="pickMC(${oi})"><span class="mk">${'가나다라마바'[k]}</span><span>${esc(q.opts[oi])}</span></button>`).join('') + `</div><div id="fb"></div></div>`;
  } else if (q.k === 'match') {
    run.st = { sel: null, pairs: {}, done: false, rorder: shuffle(q.right.map((_, i) => i)) };
    body = `<div class="q" style="${bvars(s.book)}"><div class="qt">${esc(q.q)}</div><div class="rule" style="margin-top:6px">왼쪽을 누르고, 어울리는 오른쪽을 눌러요.</div><div class="mt" id="mt"></div><div id="fb"></div></div>`;
  } else {
    run.st = { shown: false };
    body = `<div class="q" style="${bvars(s.book)}"><div class="qt">${esc(q.q)}</div>${bigHTML(q.big)}<div id="selfbox"><button class="big-btn alt" onclick="showSelf()">정답 보기</button><p class="rule">먼저 말로 답해 본 다음 정답을 확인해요.</p></div></div>`;
  }
  app.innerHTML = head + body;
  if (q.k === 'match') drawMatch();
}
function toggleQPad(){
  const box = document.getElementById('qpadbox'); if (!box) return;
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = padBox('qp', '', false); padInit('qp');
}
function leaveQuiz(){ if (!run || confirm('퀴즈를 그만두고 나갈까요? (이번 점수는 저장되지 않아요)')) go('#/s/' + run.id); }
function nextBtn(){ const s = BYID[run.id]; return `<button class="big-btn" onclick="nextQ()">${run.i + 1 < s.quiz.length ? '다음 문제 ›' : '결과 보기 ›'}</button>`; }
function record(ok, q){ run.res.push(ok); if (!ok) run.wrong.push(q); }
function pickMC(oi){
  const s = BYID[run.id], q = s.quiz[run.i]; if (run.st.done) return; run.st.done = true;
  const ok = oi === q.ans;
  document.querySelectorAll('#opts .opt').forEach(el => { const o = +el.dataset.o; el.disabled = true; if (o === q.ans) el.classList.add('ok'); else if (o === oi) el.classList.add('no'); });
  document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}" role="status">${ok ? '<b>🎉 맞았어요!</b>' : `<b>🤔 아쉬워요.</b> 정답은 <b>${esc(q.opts[q.ans])}</b>`}</div>` + nextBtn();
  record(ok, q);
}
function drawMatch(){
  const s = BYID[run.id], q = s.quiz[run.i], st = run.st, done = st.done;
  const rightOf = {}; Object.entries(st.pairs).forEach(([l, r]) => rightOf[r] = +l);
  let h = '';
  q.left.forEach((l, i) => {
    const p = st.pairs[i], cls = ['l'];
    if (st.sel === i) cls.push('sel');
    if (done) cls.push(p === q.map[i] ? 'ok' : 'no');
    h += `<button class="${cls.join(' ')}" ${done ? 'disabled' : `onclick="selL(${i})"`}>${esc(l)}${p !== undefined ? `<span class="bd">${i + 1}</span>` : ''}</button>`;
    const rj = st.rorder[i]; const owner = rightOf[rj];
    const rc = []; if (done) { if (owner !== undefined) rc.push(q.map[owner] === rj ? 'ok' : 'no'); }
    h += `<button class="${rc.join(' ')}" ${done ? 'disabled' : `onclick="selR(${rj})"`}>${esc(q.right[rj])}${owner !== undefined ? `<span class="bd">${owner + 1}</span>` : ''}</button>`;
  });
  document.getElementById('mt').innerHTML = h;
  const all = Object.keys(st.pairs).length === q.left.length;
  if (!done) document.getElementById('fb').innerHTML = `<button class="big-btn" ${all ? '' : 'disabled'} onclick="checkMatch()">확인</button>`;
}
function selL(i){ const st = run.st; if (st.sel === i) st.sel = null; else if (st.pairs[i] !== undefined && st.sel === null) { delete st.pairs[i]; st.sel = i; } else st.sel = i; drawMatch(); }
function selR(j){ const st = run.st; if (st.sel === null) return; Object.keys(st.pairs).forEach(l => { if (st.pairs[l] === j) delete st.pairs[l]; }); st.pairs[st.sel] = j; st.sel = null; drawMatch(); }
function checkMatch(){
  const s = BYID[run.id], q = s.quiz[run.i], st = run.st; st.done = true;
  const ok = q.left.every((_, i) => st.pairs[i] === q.map[i]);
  drawMatch();
  const key = q.left.map((l, i) => `${esc(l)} → ${esc(q.right[q.map[i]])}`).join(' · ');
  document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}" role="status">${ok ? '<b>🎉 모두 맞았어요!</b>' : `<b>🤔 아쉬워요.</b> 정답: ${key}`}</div>` + nextBtn();
  record(ok, Object.assign({}, q, { a: key, plain: true }));
}
function showSelf(){
  const s = BYID[run.id], q = s.quiz[run.i];
  document.getElementById('selfbox').innerHTML = `<div class="ans">${esc(q.a)}</div><div class="btnrow"><button class="big-btn" onclick="selfAns(true)">맞았어요 👍</button><button class="big-btn alt" onclick="selfAns(false)">다시 볼래요</button></div>`;
}
function selfAns(ok){ const s = BYID[run.id], q = s.quiz[run.i]; record(ok, q); nextQ(true); }
function nextQ(){ const s = BYID[run.id]; run.i++; if (run.i >= s.quiz.length) return result(); renderQ(); window.scrollTo(0, 0); }

/* ---------- result ---------- */
function ansText(q){ return q.k === 'mc' ? q.opts[q.ans] : q.a; }
function result(){
  const s = BYID[run.id], score = run.res.filter(Boolean).length, pass = score >= PASS, idx = ST.indexOf(s);
  const prev = S.best[s.id]; if (prev === undefined || score > prev) { S.best[s.id] = score; save(); }
  const nxt = ST[idx + 1];
  const wrong = run.wrong.map(q => `<li>${esc(q.q)} ${q.big ? '(' + esc(q.big) + ')' : ''} → <em>${esc(ansText(q))}</em></li>`).join('');
  app.innerHTML = `<div class="res" style="${bvars(s.book)}"><div class="stamp ${pass ? '' : 'fail'}" aria-hidden="true">${pass ? '🎉' : '💪'}</div>
    <h2>${pass ? '참 잘했어요! 통과!' : '조금만 더 힘내요!'}</h2><div class="stars" aria-label="별 ${stars(score)}개">${starStr(score)}</div>
    <p><b>${score} / ${s.quiz.length}</b> 맞혔어요 ${pass ? '' : `· ${PASS}개 이상 맞히면 다음 단계가 열려요`}</p>
    ${pass && !nxt ? '<p><b>모든 단계를 통과했어요! 정말 대단해요 🏆</b></p>' : ''}
    ${pass && nxt ? `<p>다음 단계 <b>${esc(nxt.title)}</b>${nxt.book !== s.book ? ' (' + esc(BOOK[nxt.book].name) + ')' : ''} 이(가) 열렸어요 🔓</p>` : ''}</div>
    <div class="btnrow" style="margin-top:14px">${pass && nxt ? `<button class="big-btn" onclick="go('#/s/${nxt.id}')">다음 단계로 ›</button>` : ''}
      <button class="big-btn ${pass && nxt ? 'alt' : ''}" onclick="go('#/q/${s.id}')">${pass ? '한 번 더 풀기' : '다시 도전'}</button>
      <button class="big-btn alt" onclick="go('#/s/${s.id}')">배우기·쓰기로 돌아가기</button>
      <button class="big-btn alt" onclick="go('#/')">단계 지도</button></div>
    ${wrong ? `<div class="panel wrong" style="${bvars(s.book)}"><h3>다시 볼 문제</h3><ul>${wrong}</ul><p class="rule">왜 틀렸는지 말해 봐요: 몰랐어요 / 헷갈렸어요 / 실수했어요</p></div>` : ''}`;
  window.scrollTo(0, 0);
}
route();
</script>
</body>
</html>
